<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>곤충 진화 스네이크 · 프로토타입 A</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1f3a1c; font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
      #game { position: fixed; inset: 0; }
      #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(10, 25, 8, 0.55) 100%); }
      .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); }
      #stats { top: calc(10px + env(safe-area-inset-top)); left: 12px; font-size: 14px; line-height: 1.5; }
      #stats b { font-size: 22px; }
      #board { top: calc(10px + env(safe-area-inset-top)); right: 12px; font-size: 12.5px; background: rgba(0, 0, 0, 0.22); border-radius: 10px; padding: 6px 10px; min-width: 130px; }
      #board .row { display: flex; justify-content: space-between; gap: 10px; }
      #board .me { color: #d6ff8a; font-weight: 700; }
      #minimap { top: calc(150px + env(safe-area-inset-top)); right: 12px; width: 96px; height: 96px; border-radius: 50%; background: rgba(0, 0, 0, 0.25); }
      .btn { position: fixed; display: none; align-items: center; justify-content: center; border-radius: 50%; font-weight: 800; font-size: 15px; color: #fff; background: rgba(255, 255, 255, 0.18); border: 2px solid rgba(255, 255, 255, 0.45); touch-action: none; backdrop-filter: blur(2px); }
      .btn.on { background: rgba(255, 230, 102, 0.45); border-color: #ffe066; }
      #boostBtn { right: calc(18px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); width: 86px; height: 86px; }
      #sneakBtn { right: calc(116px + env(safe-area-inset-right)); bottom: calc(30px + env(safe-area-inset-bottom)); width: 66px; height: 66px; font-size: 13px; }
      body.touch .btn { display: flex; }
      #joy { position: fixed; display: none; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35); background: rgba(255, 255, 255, 0.08); pointer-events: none; }
      #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; border-radius: 50%; background: rgba(255, 255, 255, 0.5); transform: translate(-50%, -50%); }
      .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(15, 35, 12, 0.72); backdrop-filter: blur(3px); padding: 20px; }
      .card { background: #fffdf3; color: #2c3a22; border-radius: 22px; padding: 24px 22px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35); }
      .card h1 { margin: 0 0 4px; font-size: 26px; }
      .card .sub { margin: 0 0 14px; color: #6b7a55; font-size: 13px; }
      .card ul { text-align: left; padding-left: 18px; margin: 12px 0 16px; font-size: 14px; line-height: 1.6; }
      .card .big { font-size: 15px; background: #eef7d9; border-radius: 12px; padding: 10px; margin: 10px 0; line-height: 1.5; }
      .card button { width: 100%; padding: 14px; font-size: 18px; font-weight: 800; border: 0; border-radius: 14px; background: #7cc243; color: #fff; box-shadow: 0 4px 0 #4f8f22; cursor: pointer; }
      .card button:active { transform: translateY(3px); box-shadow: 0 1px 0 #4f8f22; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
      .grid div { background: #f1f6e4; border-radius: 12px; padding: 8px; font-size: 12px; color: #6b7a55; }
      .grid b { display: block; font-size: 22px; color: #2c3a22; }
      .hidden { display: none !important; }
      #hostTag { position: fixed; left: 8px; bottom: calc(6px + env(safe-area-inset-bottom)); font-size: 10px; opacity: 0.45; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="vignette"></div>
    <div id="stats" class="hud hidden"></div>
    <div id="board" class="hud hidden"></div>
    <canvas id="minimap" class="hud hidden" width="192" height="192"></canvas>
    <div id="joy"><div id="knob"></div></div>
    <div id="sneakBtn" class="btn">살금</div>
    <div id="boostBtn" class="btn">부스트</div>
    <div id="hostTag"></div>

    <div id="start" class="overlay">
      <div class="card">
        <h1>🐛 곤충 진화 스네이크</h1>
        <p class="sub">프로토타입 A · 이동과 감싸기</p>
        <div class="big">몸으로 곤충 주위를 <b>한 바퀴 감싸면</b><br />1초 뒤 고리 안 곤충이 <b>압착</b>돼요!</div>
        <ul id="howto"></ul>
        <button id="startBtn">시작</button>
      </div>
    </div>

    <div id="over" class="overlay hidden">
      <div class="card">
        <h1 id="overTitle">잡혔다!</h1>
        <p class="sub" id="overSub"></p>
        <div class="grid">
          <div>점수<b id="oScore">0</b></div>
          <div>최대 길이<b id="oLen">0</b></div>
          <div>처치<b id="oKills">0</b></div>
          <div>압착<b id="oCrush">0</b></div>
        </div>
        <p class="sub" id="oBest"></p>
        <button id="againBtn">다시 하기</button>
      </div>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
