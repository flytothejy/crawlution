<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>크롤루션 · 곤충 진화 스네이크</title>
    <style>
      :root {
        --ink: #1b2a12;
        --gold: #ffd23f;
        --gold2: #ff9f1c;
        --ui: 'Jua', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
        --title: 'BlackHan', 'Jua', system-ui, sans-serif;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1f3a1c; font-family: var(--ui); color: #fff; user-select: none; -webkit-user-select: none; }
      button { font-family: inherit; }
      #game { position: fixed; inset: 0; }
      #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(10, 25, 8, 0.6) 100%); }
      #danger { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.25s; background: radial-gradient(ellipse at center, transparent 50%, rgba(220, 30, 20, 0.55) 100%); }
      #danger.on { opacity: 1; animation: dangerPulse 0.7s ease-in-out infinite alternate; }
      @keyframes dangerPulse { from { opacity: 0.55; } to { opacity: 1; } }
      #flash { position: fixed; inset: 0; pointer-events: none; background: #fff; opacity: 0; }
      #flash.go { animation: flash 0.5s ease-out; }
      @keyframes flash { from { opacity: 0.75; } to { opacity: 0; } }

      #hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(255, 30, 20, 0.75) 100%); }
      #hurt.go { animation: hurt 0.45s ease-out forwards; }
      @keyframes hurt { from { filter: none; } to { opacity: 0; } }
      #respawn { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; font-size: 18px; }
      #respawn b { display: block; font-family: var(--title); font-size: 72px; line-height: 1.1; color: var(--gold); }
      /* 체력바 · 목숨 */
      #hpbar { top: calc(74px + env(safe-area-inset-top)); left: 10px; width: min(46vw, 230px); height: 20px; border-radius: 11px; background: rgba(0, 0, 0, 0.5); border: 3px solid var(--ink); overflow: hidden; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3); }
      #hpbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(180deg, #b6ff8a, #4fbf2a 60%, #2f8f1a); transition: width 0.15s; }
      #hpbar i::before { content: ''; position: absolute; left: 3px; right: 3px; top: 2px; height: 4px; border-radius: 3px; background: rgba(255, 255, 255, 0.5); }
      #hpbar.low i { background: linear-gradient(180deg, #ffb08a, #e8402a 60%, #a8200f); animation: lowHp 0.5s ease-in-out infinite alternate; }
      @keyframes lowHp { to { filter: brightness(1.4); } }
      #hpbar.guard { border-color: #9ad0ff; box-shadow: 0 0 10px #9ad0ff; }
      #hpbar span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; }
      #lives { top: calc(76px + env(safe-area-inset-top)); left: calc(18px + min(46vw, 230px)); display: flex; gap: 1px; font-size: 18px; }
      #lives b { color: #ff4a5a; text-shadow: 0 2px 0 var(--ink), 1.5px 0 0 var(--ink), -1.5px 0 0 var(--ink), 0 -1.5px 0 var(--ink); }
      #lives b.lost { color: #444; opacity: 0.6; }
      /* 외곽선 글자: 게임 숫자·제목 */
      .ol { text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink), 1.5px 1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px -1.5px 0 var(--ink), 0 4px 0 rgba(0, 0, 0, 0.35); }
      .ol-thin { text-shadow: 0 1.5px 0 var(--ink), 1.5px 0 0 var(--ink), -1.5px 0 0 var(--ink), 0 -1.5px 0 var(--ink), 0 3px 0 rgba(0, 0, 0, 0.3); }
      .hud { position: fixed; pointer-events: none; }
      .panel { background: rgba(20, 34, 14, 0.55); border: 2.5px solid rgba(255, 255, 255, 0.18); border-radius: 14px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25); backdrop-filter: blur(3px); }

      /* 왼쪽 위: 내 곤충 */
      #stats { top: calc(10px + env(safe-area-inset-top)); left: 10px; display: flex; gap: 8px; align-items: center; }
      #stats .pf { width: 58px; height: 58px; border-radius: 50%; border: 3px solid var(--ink); background: radial-gradient(circle at 40% 35%, #fff8d6, var(--c, #8fd14f)); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3); display: grid; place-items: center; overflow: hidden; position: relative; flex: none; }
      #stats .pf img { width: 120%; height: 120%; object-fit: contain; }
      #stats .pfw { position: relative; }
      #stats .lv { position: absolute; right: -4px; bottom: -3px; }
      #stats .nm { font-size: 17px; line-height: 1.1; }
      #stats .stars { color: var(--gold); font-size: 12px; letter-spacing: 1px; }
      #stats .len { font-family: var(--title); font-size: 26px; line-height: 1; }
      #stats .len small { font-family: var(--ui); font-size: 13px; }
      #stats .sc { font-size: 12.5px; opacity: 0.95; }
      .badge { display: inline-block; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: var(--gold); color: var(--ink); border: 2.5px solid var(--ink); font-family: var(--title); font-size: 12px; line-height: 17px; text-align: center; }

      /* 진화 게이지 */
      #gauge { top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(40vw, 280px); text-align: center; }
      #gauge .gl { font-size: 14px; margin-bottom: 3px; }
      #gauge .gb { position: relative; height: 18px; border-radius: 10px; background: rgba(0, 0, 0, 0.45); border: 3px solid var(--ink); overflow: hidden; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3); }
      #gauge .gb i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(180deg, #e8ff9a, #8fd14f 55%, #5fa832); transition: width 0.2s; overflow: hidden; }
      #gauge .gb i::after { content: ''; position: absolute; inset: 0 -20px 0 0; background: repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.25) 0 6px, transparent 6px 12px); animation: stripes 0.6s linear infinite; }
      #gauge .gb i::before { content: ''; position: absolute; left: 3px; right: 3px; top: 2px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.55); }
      @keyframes stripes { to { transform: translateX(17px); } }
      #gauge.full .gb i { background: linear-gradient(180deg, #fff3a0, var(--gold) 55%, var(--gold2)); }
      #gauge.full .gb { animation: glow 0.6s ease-in-out infinite alternate; }
      @keyframes glow { from { box-shadow: 0 0 0 rgba(255, 210, 63, 0); } to { box-shadow: 0 0 16px 4px rgba(255, 210, 63, 0.9); } }

      /* 오른쪽: 순위·미니맵·분포 */
      #board { top: calc(10px + env(safe-area-inset-top)); right: 10px; width: 146px; padding: 4px 8px 6px; font-size: 13px; }
      #board .hd { font-size: 12px; color: var(--gold); text-align: center; margin-bottom: 1px; }
      #board .row { display: flex; align-items: center; gap: 4px; height: 19px; }
      #board .row .rk { width: 14px; font-family: var(--title); font-size: 12px; opacity: 0.85; }
      #board .row .n { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      #board .row .v { font-family: var(--title); font-size: 12px; }
      #board .me { color: #d6ff8a; }
      #board .boss { color: #ffa08a; }
      .li { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; font-size: 9.5px; border: 1.5px solid var(--ink); background: var(--c); flex: none; }
      #minimap { top: calc(150px + env(safe-area-inset-top)); right: 10px; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(60, 100, 40, 0.55), rgba(15, 30, 10, 0.75)); border: 3px solid var(--ink); box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25), 0 4px 0 rgba(0, 0, 0, 0.3); }
      #dist { top: calc(258px + env(safe-area-inset-top)); right: 10px; width: 146px; padding: 5px 7px; font-size: 11px; }
      #dist .db { display: flex; height: 9px; border-radius: 5px; overflow: hidden; background: rgba(0, 0, 0, 0.35); border: 2px solid var(--ink); }
      #dist .dl { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 4px; margin-top: 4px; }
      #dist .dl span { display: flex; align-items: center; gap: 3px; }
      #dist .dl .li { width: 15px; height: 15px; font-size: 8.5px; }

      /* 처치 소식 */
      #feed { left: 10px; top: calc(104px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 3px; font-size: 12px; max-width: 52vw; }
      #feed div { background: rgba(20, 34, 14, 0.55); border-radius: 9px; padding: 2px 8px; animation: feedIn 0.25s ease-out; transition: opacity 0.6s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #feed div.me { background: rgba(255, 210, 63, 0.35); border: 1.5px solid var(--gold); }
      @keyframes feedIn { from { transform: translateX(-30px); opacity: 0; } }

      /* 배너(리본) */
      #banner { top: 23%; left: 50%; transform: translateX(-50%); padding: 8px 34px 10px; font-family: var(--title); font-size: clamp(17px, 4.6vw, 28px); white-space: nowrap; color: #fff;
        background: linear-gradient(180deg, var(--bc, #ffb52e), var(--bc2, #f27b1c)); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35), inset 0 3px 0 rgba(255, 255, 255, 0.45); clip-path: polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%); }
      #banner.pop { animation: ribbon 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
      @keyframes ribbon { from { transform: translateX(-50%) scale(0.2, 0.2) rotate(-6deg); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }

      /* 진화 카드 */
      #cards { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); width: min(97vw, 600px); text-align: center; }
      body.touch #cards { bottom: calc(222px + env(safe-area-inset-bottom)); width: min(97vw, 520px); }
      body.touch .mcard .ds { display: none; }
      body.touch .mcard .pic { height: 52px; }
      body.touch .mcard .pic img { height: 58px; }
      body.touch .mcard .sk { font-size: 11px; padding: 1px 6px; margin-bottom: 5px; }
      #cards .ctitle { display: inline-block; font-family: var(--title); font-size: 18px; margin-bottom: 8px; animation: bob 0.8s ease-in-out infinite alternate; }
      #cards .ctitle b { color: var(--gold); }
      @keyframes bob { to { transform: translateY(-4px); } }
      #cards .crow { display: flex; gap: 7px; align-items: flex-end; }
      .mcard { position: relative; flex: 1; min-width: 0; padding: 0 0 8px; border-radius: 16px; background: linear-gradient(180deg, #fffdf3, #f1ead0); color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink), 0 10px 18px rgba(0, 0, 0, 0.35); cursor: pointer; touch-action: none; overflow: hidden;
        animation: cardIn 0.45s cubic-bezier(0.2, 1.5, 0.4, 1) backwards; }
      .mcard:nth-child(2) { animation-delay: 0.07s; }
      .mcard:nth-child(3) { animation-delay: 0.14s; }
      @keyframes cardIn { from { transform: translateY(120px) rotate(4deg); opacity: 0; } }
      .mcard:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
      .mcard .top { background: var(--c); color: #fff; padding: 3px 0 4px; font-size: 13px; border-bottom: 3px solid var(--ink); }
      .mcard .pic { height: 66px; margin: 2px 0 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--c) 30%, #fff) 0 34%, transparent 35%); }
      .mcard .pic img { height: 74px; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.25)); animation: wiggle 1.4s ease-in-out infinite alternate; }
      @keyframes wiggle { from { transform: rotate(-4deg); } to { transform: rotate(4deg) translateY(-2px); } }
      .mcard .nm { font-family: var(--title); font-size: 17px; margin: 0 4px; }
      .mcard .sk { display: inline-block; margin: 2px 0; padding: 1px 8px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 12px; }
      .mcard .ds { font-size: 11px; color: #5b6a45; line-height: 1.25; margin: 2px 5px 4px; min-height: 28px; }
      .mcard .odds { display: flex; justify-content: center; gap: 4px; font-size: 12px; }
      .mcard .odds span { padding: 0 6px; border-radius: 8px; border: 2px solid; }
      .mcard .g { color: #2e8a20; border-color: #2e8a20; background: #e4f8d6; }
      .mcard .b { color: #c4301f; border-color: #c4301f; background: #fde3de; }
      .mcard .z { color: #8a8a8a; border-color: #bbb !important; }
      .mcard .key { position: absolute; left: 5px; top: 28px; }
      .mcard.best::after { content: '추천'; position: absolute; right: -26px; top: 32px; transform: rotate(40deg); background: var(--gold); color: var(--ink); font-size: 11px; padding: 1px 28px; border: 2px solid var(--ink); }

      /* 둥근 게임 버튼(모바일) */
      .rbtn { position: fixed; display: none; flex-direction: column; align-items: center; justify-content: center; border-radius: 50%; color: #fff; touch-action: none;
        border: 3.5px solid var(--ink); box-shadow: 0 6px 0 var(--ink), inset 0 4px 0 rgba(255, 255, 255, 0.45), inset 0 -6px 0 rgba(0, 0, 0, 0.18); }
      .rbtn .ic { font-size: 26px; line-height: 1; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.35)); }
      .rbtn .t { font-size: 13px; }
      .rbtn.on { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink), inset 0 4px 0 rgba(255, 255, 255, 0.3), inset 0 -2px 0 rgba(0, 0, 0, 0.18); filter: brightness(1.15); }
      #boostBtn { right: calc(16px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); width: 84px; height: 84px; background: radial-gradient(circle at 50% 30%, #ffd36b, #ff8a1c 70%); }
      #sneakBtn { right: calc(112px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom)); width: 62px; height: 62px; background: radial-gradient(circle at 50% 30%, #a8f0d2, #2fae8a 70%); }
      #sneakBtn .ic { font-size: 20px; }
      #sneakBtn .t { font-size: 11px; }
      body.touch .rbtn { display: flex; }

      /* 스킬 버튼 */
      #skillBtn { position: fixed; display: flex; flex-direction: column; align-items: center; justify-content: center; right: calc(16px + env(safe-area-inset-right)); bottom: calc(126px + env(safe-area-inset-bottom)); width: 84px; height: 84px; border-radius: 50%; color: #fff; touch-action: none; cursor: pointer; overflow: hidden;
        background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--c, #888) 45%, #fff), var(--c, #888) 70%); border: 3.5px solid var(--ink); box-shadow: 0 6px 0 var(--ink), inset 0 4px 0 rgba(255, 255, 255, 0.45); }
      body:not(.touch) #skillBtn { bottom: calc(22px + env(safe-area-inset-bottom)); }
      #skillBtn::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(10, 15, 8, 0.7) var(--cd, 0deg), transparent 0); }
      #skillBtn.ready::after { content: ''; position: absolute; top: -20%; bottom: -20%; width: 30%; left: -40%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent); transform: skewX(-20deg); animation: shine 1.6s ease-in-out infinite; }
      @keyframes shine { 0%, 50% { left: -40%; } 100% { left: 130%; } }
      #skillBtn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
      #skillBtn > * { position: relative; z-index: 1; }
      #skillBtn .ic { font-size: 27px; line-height: 1.05; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.35)); }
      #skillBtn .sn { font-size: 11.5px; line-height: 1.1; text-align: center; padding: 0 6px; }
      #skillBtn .cd { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--title); font-size: 30px; z-index: 2; }
      #skillBtn.cooling .ic, #skillBtn.cooling .sn { opacity: 0.35; }
      #skillBtn .key { position: absolute; top: 5px; right: 14px; z-index: 2; }
      #skillBtn.none { display: none; }

      #joy { position: fixed; display: none; width: 116px; height: 116px; margin: -58px 0 0 -58px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.45); background: radial-gradient(circle, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.16)); pointer-events: none; }
      #knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #cfe8b8); border: 3px solid var(--ink); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3); transform: translate(-50%, -50%); }

      /* 시작·결과 화면 */
      .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; padding: 20px; overflow: hidden auto;
        background: radial-gradient(circle at 50% 35%, rgba(70, 120, 40, 0.55), rgba(10, 25, 8, 0.88)); backdrop-filter: blur(4px); }
      .rays { position: absolute; left: 50%; top: 30%; width: 900px; height: 900px; margin: -450px 0 0 -450px; pointer-events: none; opacity: 0.16;
        background: repeating-conic-gradient(#fff 0 8deg, transparent 8deg 22deg); border-radius: 50%; mask: radial-gradient(circle, #000 15%, transparent 62%); -webkit-mask: radial-gradient(circle, #000 15%, transparent 62%); animation: spin 30s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .logo { position: relative; font-family: var(--title); font-size: clamp(48px, 14vw, 78px); line-height: 1; color: #fff; letter-spacing: 1px;
        text-shadow: 0 4px 0 var(--ink), 4px 0 0 var(--ink), -4px 0 0 var(--ink), 0 -4px 0 var(--ink), 3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink), 0 9px 0 rgba(0, 0, 0, 0.35); animation: logoIn 0.7s cubic-bezier(0.2, 1.6, 0.4, 1); }
      .logo span { color: var(--gold); }
      @keyframes logoIn { from { transform: scale(0.3) rotate(-8deg); opacity: 0; } }
      .tag { position: relative; margin: 8px 0 2px; padding: 3px 14px; border-radius: 12px; background: var(--ink); font-size: 14px; color: #d6ff8a; }
      .lineup { position: relative; display: flex; gap: 0; margin: 6px 0 8px; height: 80px; align-items: flex-end; }
      .lineup img { height: 74px; width: 74px; object-fit: contain; animation: hop 0.9s ease-in-out infinite alternate; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.3)); }
      .lineup img:nth-child(2) { animation-delay: 0.15s; }
      .lineup img:nth-child(3) { animation-delay: 0.3s; }
      .lineup img:nth-child(4) { animation-delay: 0.45s; }
      .lineup img:nth-child(5) { animation-delay: 0.6s; }
      @keyframes hop { to { transform: translateY(-8px) rotate(-4deg); } }
      .box { position: relative; width: 100%; max-width: 380px; background: linear-gradient(180deg, #fffdf3, #efe7c8); color: var(--ink); border: 3.5px solid var(--ink); border-radius: 22px; padding: 14px 16px 16px; box-shadow: 0 7px 0 var(--ink), 0 16px 30px rgba(0, 0, 0, 0.4); }
      .box .goal { font-size: 15.5px; text-align: center; line-height: 1.45; margin-bottom: 8px; }
      .box .goal b { color: #d2541c; }
      .how { display: grid; gap: 5px; margin: 6px 0 12px; }
      .how div { display: flex; align-items: center; gap: 8px; font-size: 13.5px; background: rgba(27, 42, 18, 0.07); border-radius: 10px; padding: 5px 8px; }
      .how .i { font-size: 19px; width: 26px; text-align: center; }
      .how b { color: #d2541c; font-weight: normal; }
      .legend { display: flex; justify-content: center; gap: 10px; font-size: 12.5px; margin: 2px 0 8px; }
      .legend span { display: inline-flex; align-items: center; gap: 4px; }
      .legend i { width: 13px; height: 13px; border-radius: 50%; border: 3px solid; }
      .gbtn { display: block; width: 100%; padding: 12px 0 14px; font-family: var(--title); font-size: 24px; color: #fff; cursor: pointer; border: 3.5px solid var(--ink); border-radius: 16px;
        background: linear-gradient(180deg, #ffe36b, var(--gold) 45%, var(--gold2)); box-shadow: 0 6px 0 var(--ink), inset 0 4px 0 rgba(255, 255, 255, 0.6), inset 0 -5px 0 rgba(180, 80, 0, 0.3); }
      .gbtn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink), inset 0 4px 0 rgba(255, 255, 255, 0.6); }
      .gbtn.pulse { animation: pulse 1s ease-in-out infinite; }
      @keyframes pulse { 50% { transform: scale(1.04); } }
      .best { text-align: center; font-size: 13px; margin-top: 10px; color: #6b5a2a; }

      .rtitle { position: relative; font-family: var(--title); font-size: clamp(30px, 9vw, 44px); padding: 8px 44px 12px; margin-bottom: -18px; z-index: 2; color: #fff; white-space: nowrap;
        background: linear-gradient(180deg, var(--bc, #ff6b5a), var(--bc2, #c93a2a)); border: 3.5px solid var(--ink); border-radius: 10px; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35), inset 0 4px 0 rgba(255, 255, 255, 0.4);
        clip-path: polygon(0 0, 100% 0, 95% 50%, 100% 100%, 0 100%, 5% 50%); animation: logoIn 0.6s cubic-bezier(0.2, 1.6, 0.4, 1); }
      #over.win .rtitle { --bc: #ffd23f; --bc2: #f08a12; }
      #over .box { padding-top: 28px; }
      .rsub { text-align: center; font-size: 14.5px; color: #6b5a2a; margin-bottom: 6px; }
      #oPath { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px; margin: 4px 0 6px; }
